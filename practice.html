<section>
<h2>اليوم 1: النزاهة وخريطة الأدبيات</h2>
<ol>
<li><p>كتب باحث مساعد فقرة في المقدمة بمساعد ذكاء اصطناعي، وفيها مرجع اقترحه المساعد. بعد النشر تبيّن أن المرجع لا وجود له. الورقة عليها ثلاثة مؤلفين. من يُسأل؟</p><ul><li><b>أ.</b> الشركة التي تنتج المساعد</li><li><b>ب.</b> الباحث المساعد وحده، لأنه من استعمل الأداة</li><li><b>ج.</b> المؤلفون الثلاثة، لأن أسماءهم على الورقة</li><li><b>د.</b> المحكّمون، لأنهم أجازوا الورقة</li></ul></li>
<li><p>تسلّمتَ مقترح منحة للتحكيم، وبقي يومان. تعليمات الجهة المانحة لا تذكر الذكاء الاصطناعي. ما التصرف الذي يتفق مع ما سبق؟</p><ul><li><b>أ.</b> تسأل الجهة المانحة كتابةً، ولا يدخل المقترح أي أداة قبل ردّها</li><li><b>ب.</b> ترفعه إلى المساعد، لأن التعليمات لم تمنع ذلك</li><li><b>ج.</b> ترفعه إلى المساعد، ثم تفصح عن ذلك في تقريرك</li><li><b>د.</b> تحذف أسماء الباحثين من المقترح ثم ترفعه</li></ul></li>
<li><p>أربعة باحثين سجّلوا بحثهم في القاعدة نفسها. أي سطر يكفي ليعيد زميل البحث ويعرف أنه نفّذ البحث نفسه؟</p><ul><li><b>أ.</b> الكلمات المفتاحية الخمس، والمنصة، والتاريخ، والحدود، وعدد النتائج</li><li><b>ب.</b> «كما في القاعدة السابقة»، والمنصة، والتاريخ، والحدود، وعدد النتائج</li><li><b>ج.</b> وصف المساعد للاستعلام، والمنصة، والتاريخ، والحدود، وعدد النتائج</li><li><b>د.</b> الاستعلام كما نُفّذ حرفيًا، والمنصة، والتاريخ، والحدود، وعدد النتائج</li></ul></li>
<li><p>على عينة فيها 20 دراسة تستحق الإدراج: المساعد الأول أدرج 30 سجلًا، منها 19 تستحق. المساعد الثاني أدرج 16 سجلًا، كلها تستحق. أيهما تعتمد للفرز الأول في مراجعة؟</p><ul><li><b>أ.</b> الثاني، لأنه لم يدرج أي سجل خطأ</li><li><b>ب.</b> الأول، لأنه أضاع دراسة واحدة من عشرين</li><li><b>ج.</b> الثاني، لأن ما يُقرأ بعده أقل</li><li><b>د.</b> أيهما، فالفرق بينهما يتعادل</li></ul></li>
<li><p>في جدول قياسات 14 قيمة ناقصة. طلب باحث من المساعد أن يملأها بقيم «تبدو معقولة»، ثم حلّل الجدول ولم يذكر ذلك في الورقة. كيف تصنّف بطاقة معهد هَجير هذا الاستخدام؟</p><ul><li><b>أ.</b> يُفصح عنه، لأن تعويض القيم الناقصة طريقة إحصائية معروفة</li><li><b>ب.</b> مقبول، لأن القيم قريبة من القيم المجاورة لها</li><li><b>ج.</b> محظور، لأنه اختلاق بيانات</li><li><b>د.</b> مقبول إذا راجع الإحصائي القيم بعد ملئها</li></ul></li>
<li><p>باحثة تريد تفريغ مقابلات مع عمال بأداة تفريغ آلية. الموافقة الأخلاقية للمشروع لا تذكر أي أداة آلية. الأداة معتمدة في المعهد لمشاريع أخرى. ما الذي تفعله أولًا؟</p><ul><li><b>أ.</b> تعرض التعديل على لجنة أخلاقيات البحث قبل أن ترفع أي تسجيل</li><li><b>ب.</b> تستخدم الأداة مباشرة، لأن المعهد اعتمدها لمشاريع أخرى</li><li><b>ج.</b> تستخدم الأداة، وتذكر ذلك في قسم الأساليب عند كتابة الورقة</li><li><b>د.</b> تحذف الأسماء من التسجيلات أولًا، ثم ترفعها إلى الأداة</li></ul></li>
<li><p>كتب باحث مسودته بنفسه ثم شغّل المدقق الإملائي والنحوي في برنامج الكتابة. زميله يقول: «هذا ذكاء اصطناعي، ويجب أن تفصح عنه». بماذا تحكم بطاقة المعهد؟</p><ul><li><b>أ.</b> يُفصح عنه، لأن كل أداة آلية تُذكر</li><li><b>ب.</b> مقبول دون إفصاح، وتُراجَع سياسة المجلة فقد تكون أشد</li><li><b>ج.</b> محظور، لأن النص يجب أن يكون من كتابة الباحث كله</li><li><b>د.</b> يُفصح عنه إذا تجاوزت التصحيحات عشرة</li></ul></li>
<li><p>اقترح أحد المؤلفين أن يُضاف المساعد إلى قائمة المؤلفين «إنصافًا له، فقد كتب نصف المناقشة». ما الرد الذي يتفق مع قواعد التأليف؟</p><ul><li><b>أ.</b> يضاف مؤلفًا أخيرًا، لأن مساهمته حقيقية</li><li><b>ب.</b> يضاف في الشكر باسمه مؤلفًا مشاركًا</li><li><b>ج.</b> لا يُذكر المساعد في الورقة إطلاقًا، فهو ليس مؤلفًا</li><li><b>د.</b> لا يُذكر مؤلفًا، ويُفصح عن استخدامه وما تُحقق منه</li></ul></li>
<li><p>فرزتَ 50 سجلًا بيدك فأدرجت 12. المساعد أدرج 14 سجلًا من الخمسين، منها 9 مما أدرجته أنت. ما استدعاء المساعد على فرزك؟</p><ul><li><b>أ.</b> 9 من 14</li><li><b>ب.</b> 9 من 12</li><li><b>ج.</b> 14 من 50</li><li><b>د.</b> 12 من 14</li></ul></li>
<li><p>اقترح زميل أن تفتحوا قرارات المساعد أولًا ثم «تصحّحوا» ما تختلفون معه فيه، توفيرًا للوقت. لماذا لا يصلح هذا لقياس الاستدعاء؟</p><ul><li><b>أ.</b> لأن المساعد يتعلم من تصحيحاتكم فتتغير قراراته</li><li><b>ب.</b> لأن التصحيح يأخذ وقتًا أطول من الفرز</li><li><b>ج.</b> لأن من يرى قرار المساعد يميل إليه، فيقيس اتفاقه معه</li><li><b>د.</b> لأن الاستدعاء لا يُحسب إلا على السجلات كلها</li></ul></li>
<li><p>سجل يستوفي معايير الإدراج كلها، ووجدت معرّفه في قائمة الأوراق المسحوبة. ما التصرف السليم في المراجعة؟</p><ul><li><b>أ.</b> يُحذف من ملف السجلات كأنه لم يُسترجع</li><li><b>ب.</b> يُدرج في التوليف كغيره، لأنه استوفى المعايير</li><li><b>ج.</b> يُدرج ويُترك الحكم للقارئ دون ذكر السحب</li><li><b>د.</b> يُسجَّل مسحوبًا، ويُستبعد من التوليف مع ذكر ذلك</li></ul></li>
<li><p>فريق يفرز سجلات رتّبها مساعد. قرروا التوقف عند أول خمسين سجلًا متتاليًا بلا دراسة ذات صلة. ورقتان يعرفهما الفريق قبل البحث لم تظهرا بعد. ماذا يفعلون عند تحقق شرط الخمسين؟</p><ul><li><b>أ.</b> يواصلون الفرز، فغياب الورقتين يعني أن الفرز لم ينتهِ</li><li><b>ب.</b> يتوقفون، لأن الشرط الذي أعلنوه قبل الفرز قد تحقق</li><li><b>ج.</b> يتوقفون، ويضيفون الورقتين المعروفتين إلى المُدرج باليد</li><li><b>د.</b> يرفعون الشرط إلى مئة سجل متتالٍ ويتوقفون عنده</li></ul></li>
</ol>
</section>
<section>
<h2>اليوم 2: الملخصات والتحليل</h2>
<ol>
<li><p>وجد «مُعين» 11 دراسة من 14 تستحق الإدراج في العينة. زميل يقترح: «نعتمده لبقية السجلات، ونقرأ بيدنا ما أدرجه فقط». ما الذي يغفله الاقتراح؟</p><ul><li><b>أ.</b> أن بعض ما أدرجه المساعد لا يستحق الإدراج</li><li><b>ب.</b> أن ما استبعده المساعد خطأً لن يقرأه أحد</li><li><b>ج.</b> أن خمسين سجلًا لا تصلح لأي قياس</li><li><b>د.</b> أن بين السجلات أوراقًا مسحوبة</li></ul></li>
<li><p>الورقة: «دراسة مقطعية على 140 ممرضة في مستشفى واحد. أبلغت 41% منهن عن أرق، والنسبة أعلى بين من يعملن ليلًا. التصميم لا يثبت اتجاه العلاقة». أي عبارة في ملخص المساعد تخالفها؟</p><ul><li><b>أ.</b> «أبلغت 41% من المشاركات عن أرق»</li><li><b>ب.</b> «الدراسة مقطعية في مستشفى واحد»</li><li><b>ج.</b> «النسبة أعلى بين العاملات ليلًا»</li><li><b>د.</b> «العمل الليلي يسبب الأرق لدى الكوادر الصحية»</li></ul></li>
<li><p>الورقة: «أصيب 8% في مجموعة التدريب و10% في المجموعة الأخرى. الخطر النسبي 0.80 (فترة الثقة 95%: من 0.55 إلى 1.16)». أي عبارة تنقل ذلك بأمانة؟</p><ul><li><b>أ.</b> «8% مقابل 10%، والفرق غير قاطع: فترة الثقة تشمل الواحد»</li><li><b>ب.</b> «خفّض التدريب الإصابة 20 نقطة مئوية»</li><li><b>ج.</b> «أثبتت الدراسة أن التدريب يخفض الإصابة بالخُمس»</li><li><b>د.</b> «لم يُظهر التدريب أي أثر في الإصابة بين المجموعتين»</li></ul></li>
<li><p>خطة تحليل معلنة تحدد المتغير والعتبة والاستبعاد. أي تصرف من هذه يفتح مسارًا متشعبًا يجب تسجيله انحرافًا؟</p><ul><li><b>أ.</b> أن يكتب المساعد رموزًا تنفذ الخطة، ويراجعها الإحصائي</li><li><b>ب.</b> تنفيذ التحليل الثانوي المذكور في الخطة</li><li><b>ج.</b> حذف ثلاثة أيام «شاذة» بعد أن ظهرت النتيجة غير قاطعة</li><li><b>د.</b> تثبيت بذرة إعادة المعاينة بالقيمة التي في الخطة</li></ul></li>
<li><p>أربعة أرقام مرشحة لجملة النتيجة. أيها يدخل الورقة؟</p><ul><li><b>أ.</b> رقم في المخرجات المحفوظة في دفتر تسلّمته، ولم تعد تشغيله</li><li><b>ب.</b> رقم طبعته خلية في تشغيلين نظيفين متطابقين</li><li><b>ج.</b> رقم ذكره المساعد في المحادثة وهو يشرح النتيجة</li><li><b>د.</b> رقم خرج من تشغيل واحد لإعادة معاينة بلا بذرة</li></ul></li>
<li><p>ورقة تقول: «المعدل 6.2 زيارة لكل ألف يوم عمل في الأيام الحارة و2.9 في غيرها. نسبة المعدل 2.1». ملخص المساعد يقول: «ارتفع الخطر 6.2 مرة». ما نوع الخطأ؟</p><ul><li><b>أ.</b> خطأ في الفئة المدروسة، لأن العاملين لم يُذكروا</li><li><b>ب.</b> خطأ في الأسلوب، لأن التصميم لم يُذكر في الملخص</li><li><b>ج.</b> خطأ في حجم الأثر: المعدل قُدّم على أنه النسبة</li><li><b>د.</b> لا خطأ، فالرقم 6.2 وارد في الورقة كما هو</li></ul></li>
<li><p>ورقة تذكر نسبة أرجحية 1.6 بفترة ثقة 95% من 0.98 إلى 2.7، ويقول مؤلفوها إن الفرق لم يبلغ الدلالة الإحصائية. أي عبارة في ملخص تنقل ذلك بأمانة؟</p><ul><li><b>أ.</b> «الخطر أعلى بـ60%، والفرق ذو دلالة إحصائية بين المجموعتين»</li><li><b>ب.</b> «لا فرق بين المجموعتين في نسبة الأرجحية»</li><li><b>ج.</b> «أثبتت الدراسة أن العمل في الحر يضر الكلى»</li><li><b>د.</b> «نسبة الأرجحية 1.6 (من 0.98 إلى 2.7): إشارة غير قاطعة»</li></ul></li>
<li><p>دقّقتَ ملخصًا عبارةً عبارة فوجدت كل عبارة فيه تطابق مقطعًا في الورقة. زميلك يقول: «لا بد أن فيه خطأ، ابحث أكثر». ما الحكم؟</p><ul><li><b>أ.</b> تعيد صياغة الملخص احتياطًا</li><li><b>ب.</b> تسجّل «لا خطأ» مع أرقام المقاطع التي طابقتها، ويُعتمد</li><li><b>ج.</b> تسجّل خطأ في الاستنتاج، لأن الملخصات تبالغ دائمًا</li><li><b>د.</b> ترفضه، لأن ملخصات المساعد لا يوثق بها</li></ul></li>
<li><p>ورقة حللت بلاغات الإسعاف في محافظة واحدة، وتقول صراحةً إنها لا تقيّم أي سياسة. ملخص المساعد ينتهي بـ: «تبيّن النتائج أن حظر العمل وقت الظهيرة يخفض البلاغات في المنطقة كلها». ما الذي أضافه الملخص؟</p><ul><li><b>أ.</b> تعميمًا في النطاق، وحكمًا على سياسة لم تُدرس</li><li><b>ب.</b> خطأ في حجم الأثر، لأن الانخفاض لم يُذكر رقمه</li><li><b>ج.</b> لا شيء: هذا تفسير معقول لما وجدته الورقة</li><li><b>د.</b> خطأ في الفئة المدروسة وحدها، لا في الاستنتاج</li></ul></li>
<li><p>دفتر تحليل مخرجاته المحفوظة تبدو سليمة. حين أعدت تشغيل النواة وشغّلت الخلايا من أولها توقف برسالة أن متغيرًا غير معرّف. ما التفسير الأرجح؟</p><ul><li><b>أ.</b> المكتبات على جهازك أقدم من مكتبات من كتب الدفتر</li><li><b>ب.</b> ملف البيانات تغيّر بعد أن حُفظ الدفتر ومخرجاته</li><li><b>ج.</b> النواة لم تبدأ كما يجب، وتحتاج إلى إعادة تشغيل ثانية</li><li><b>د.</b> عُرّف المتغير في خلية حُذفت، وبقي في ذاكرة الجلسة</li></ul></li>
<li><p>خطة التحليل تحدد اليوم الحار بحرارة عظمى 45 درجة أو أكثر. النتيجة بهذا التعريف غير قاطعة. المساعد جرّب ستة تعريفات أخرى وعرض أوضحها. ما التصرف الذي يحفظ النتيجة؟</p><ul><li><b>أ.</b> تعتمد التعريف الأوضح، لأنه أقوى إحصائيًا من تعريف الخطة</li><li><b>ب.</b> تعرض الأساسية كما في الخطة، والتعريف الآخر انحرافًا بجوارها</li><li><b>ج.</b> تحذف تجارب المساعد من الدفتر، وتعرض التعريف الأوضح وحده</li><li><b>د.</b> تعدّل الخطة لتطابق التعريف الأوضح، وتؤرّخ التعديل</li></ul></li>
<li><p>شغّلت الدفتر مرتين من أوله فخرجت فترة الثقة مرة من 0.95 إلى 1.71 ومرة من 0.93 إلى 1.74. ما السبب الأرجح، وما العلاج؟</p><ul><li><b>أ.</b> خطأ في ملف البيانات، والعلاج إعادة تنزيله من مصدره</li><li><b>ب.</b> تذبذب طبيعي، والعلاج أن يُذكر التشغيلان معًا</li><li><b>ج.</b> إعادة معاينة بلا بذرة، والعلاج تثبيت بذرة الخطة</li><li><b>د.</b> عينات قليلة، والعلاج مضاعفة عددها إلى 4,000</li></ul></li>
<li><p>سياسة المقرر تجعل المساعد «معلّمًا» في خطة التحليل. أي طلب يتفق مع هذا الدور؟</p><ul><li><b>أ.</b> «اكتب لي خطة تحليل كاملة لهذه البيانات قبل أن أراها»</li><li><b>ب.</b> «جرّب عدة تحليلات واقترح الذي يعطي أوضح نتيجة»</li><li><b>ج.</b> «هذه خطتي: حسّنها وأعد كتابتها بصياغة أدق»</li><li><b>د.</b> «هذه خطتي: اسألني عن تصميمها، ولا تعدّلها»</li></ul></li>
<li><p>في مسودة النتائج جملة فيها «نسبة المعدل 2.4». بحثت في مخرجات الدفتر فلم تجد خلية تطبع هذا الرقم. ما الذي تفعله؟</p><ul><li><b>أ.</b> تبقيه إن بدا قريبًا من الأرقام الأخرى</li><li><b>ب.</b> تسأل المساعد من أين جاء الرقم وتعتمد جوابه</li><li><b>ج.</b> تحذفه وتكتب الجملة من مخرجات الدفتر وحدها</li><li><b>د.</b> تضيف خلية تطبع 2.4 ليصير له مصدر</li></ul></li>
<li><p>تكتب بيان إفصاح لمجلة تطلب: أسماء الأدوات، وكيف استُخدمت وفي أي جزء، وكيف قُيّمت صحة مخرجاتها. أي بيان يستوفي البنود الثلاثة؟</p><ul><li><b>أ.</b> «استُخدم المساعد س في فرز العناوين والملخصات، وقيس استدعاؤه على 50 سجلًا مفروزة باليد»</li><li><b>ب.</b> «استُخدمت أدوات ذكاء اصطناعي في بعض مراحل العمل، وراجع المؤلفون مخرجاتها»</li><li><b>ج.</b> «استُخدم المساعد س في فرز العناوين والملخصات، وهو أداة موثوقة ومعروفة في المجال»</li><li><b>د.</b> «استُخدم المساعد س، وراجع المؤلفون كل ما كتبه ويتحملون مسؤوليته»</li></ul></li>
<li><p>في بطاقة إعادة التصميم: خط الأساس 40 دقيقة وخطآن. التنفيذ الأول بمساعد 55 دقيقة وخطأ واحد. التنفيذ الثاني 35 دقيقة بلا أخطاء. كيف تعرض القياس في المراجعة المباشرة؟</p><ul><li><b>أ.</b> تعرض التنفيذ الثاني وحده، لأنه النتيجة النهائية</li><li><b>ب.</b> تعرض متوسط التنفيذين مقابل خط الأساس، فهو أعدل رقم</li><li><b>ج.</b> تحذف التنفيذ الأول من الورقة، لأنه كان تجربة لا قياسًا</li><li><b>د.</b> تعرض الأرقام الثلاثة كما هي، وما غيّرته بين التنفيذين</li></ul></li>
</ol>
